# LiteLLM Config — Gemini (free) — TEMPLATE
# 1. Copy this file as "litellm_config.yaml"
# 2. Put your Gemini key instead of YOUR_GEMINI_API_KEY
# 3. Never put the real key in git!

model_list:
  # Main brain: Gemini Flash (free, 1M context)
  - model_name: gemini-2.5-flash-lite
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: "YOUR_GEMINI_API_KEY"

  # Offline fallback: local Qwen (only if you have Ollama installed)
  # - model_name: qwen-local
  #   litellm_params:
  #     model: ollama/qwen2.5:1.5b
  #     api_base: "http://localhost:11434"
